<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地図を読もう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 地形図の色づかい：うすい緑の街区・白い道路・青いバス路線。解説の強調はだいだい色だけ */
:root{
  --bg:#EEF2EF; --paper:#FFFFFF; --ink:#1F2A2E; --sub:#55666C; --line:#C9D2CE;
  --accent:#24609A; --accent-weak:#E1ECF6;
  --ok:#2E7D4F; --ok-weak:#E3F3E8; --ng:#B0552C; --ng-weak:#FBEAE0;
  --hl:#E8761E; --route:#2F6FB3;
  --font:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
rt{font-size:.5em;font-weight:400;letter-spacing:0}
button{font-family:var(--font);color:var(--ink);touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

.btn{min-height:56px;min-width:56px;padding:6px 24px;border-radius:12px;border:2px solid var(--accent);
  background:var(--paper);color:var(--accent);font-size:21px;font-weight:700;line-height:1.9}
.btn.primary{background:var(--accent);color:#fff}
.btn.small{min-height:48px;font-size:18px;padding:4px 16px}
.btn:disabled{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:2px 14px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-weight:700;font-size:17px}

/* スタート */
#start{align-items:center;justify-content:center;padding-inline:16px}
.topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;display:flex;gap:10px}
.startcard{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;max-width:640px}
.startcard h1{margin:0;font-size:clamp(36px,7vw,56px);letter-spacing:.06em;line-height:1.6}
.lead{margin:0;font-size:22px;line-height:2;color:var(--sub)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.minimap{width:min(300px,70vw);height:auto}

/* 問題画面 */
.qhead{display:flex;align-items:center;gap:12px;padding:10px 14px}
#prog{flex:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;background:#D5DDD9;border:2px solid transparent}
.dot.now{border-color:var(--accent);background:#fff}
.dot.ok{background:var(--ok)}.dot.ng{background:var(--ng)}
.qmain{flex:1;min-height:0;display:flex;gap:12px;padding:0 12px 12px}
.mapcol{flex:1 1 60%;min-width:0;min-height:0;display:flex}
#mapbox{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#mapsizer{position:relative;flex:none}
#mapscale{position:absolute;left:0;top:0;width:1010px;height:860px;transform-origin:0 0}
#mapscale>svg{position:absolute;inset:0}
#hl{pointer-events:none}
#labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:700;line-height:1.15;text-align:center;color:var(--ink)}
.lab.bld{font-size:18px}
.lab.park{font-size:18px;color:#2F5B2A}
.lab.stop{font-size:16px;background:#fff;border:2px solid var(--route);border-radius:7px;padding:1px 6px;color:var(--route)}
.lab.sta{font-size:19px}
.lab.leg{transform:translate(0,-50%);text-align:left;font-size:16px;font-weight:400}
.lab.north{font-size:20px}
.lab.small{font-size:15px;font-weight:400}

.panel{flex:0 0 min(460px,42%);min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px}
.qnum{font-size:17px;color:var(--sub);font-weight:700}
.qtext{font-size:22px;line-height:2.05;font-weight:700}
.qtext .ico{vertical-align:middle}
.bigico{display:flex;justify-content:center}
.choices{display:flex;flex-direction:column;gap:10px}
.choices.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;align-items:center;gap:12px;min-height:58px;width:100%;padding:8px 14px;text-align:left;font-size:20px;font-weight:700;line-height:1.8;
  background:#fff;border:2px solid var(--line);border-radius:12px}
.choice .bd{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--accent-weak);color:var(--accent);font-size:18px}
.choice.thumb{flex-direction:column;align-items:stretch;gap:4px;padding:8px}
.choice.thumb svg{width:100%;height:auto}
.choice.ok{border-color:var(--ok);background:var(--ok-weak)}
.choice.ng{border-color:var(--ng);background:var(--ng-weak)}
.choice .mk{margin-left:auto;font-size:18px;white-space:nowrap}
.choice.ok .mk{color:var(--ok)}.choice.ng .mk{color:var(--ng)}
.choice:disabled{cursor:default;opacity:1;color:var(--ink)}
.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.numrow input{width:130px;height:60px;font-size:30px;font-weight:700;text-align:center;border:2px solid var(--line);border-radius:12px;font-family:var(--font);color:var(--ink);background:#fff;-webkit-user-select:text;user-select:text}
.stp{width:56px;height:56px;border-radius:12px;border:2px solid var(--accent);background:#fff;color:var(--accent);font-size:24px;font-weight:700}
.unit{font-size:22px;font-weight:700}
.fb{border-radius:12px;padding:12px 14px;font-size:21px;font-weight:700;line-height:1.9}
.fb.ok{background:var(--ok-weak);color:var(--ok)}
.fb.ng{background:var(--ng-weak);color:var(--ng)}
.exp{font-size:19px;line-height:2.05;border-left:5px solid var(--hl);padding:2px 0 2px 12px}
.exp p{margin:0 0 6px}
.next{align-self:flex-end}
.lrfig{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lrcap{font-size:16px;color:var(--sub)}
.lrrow{display:flex;align-items:center;gap:8px}
.lrside{display:flex;flex-direction:column;align-items:center;gap:4px}
.lrlab{font-size:18px;font-weight:700;color:var(--hl)}
.lrbox{min-width:96px;padding:6px 10px;border:2px solid var(--line);border-radius:8px;text-align:center;font-size:18px;font-weight:700;line-height:1.8}
.lrbox.ok{border-color:var(--hl)}
.lrroad{width:54px;height:110px}
.truthlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}

@media (orientation:portrait){
  .qmain{flex-direction:column}
  .mapcol{flex:1 1 52%}
  .panel{flex:1 1 48%}
}

/* 結果 */
#result{align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.rescard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:16px;align-items:center}
.rescard h2{margin:0;font-size:30px}
.score{font-size:30px;font-weight:700;line-height:2}
.reslist{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.resitem{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:17px;display:flex;gap:8px;align-items:center;line-height:1.9}
.resitem b{font-size:20px}.resitem .o{color:var(--ok)}.resitem .x{color:var(--ng)}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* モーダル */
.modal{position:fixed;inset:0;background:rgba(31,42,46,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{background:var(--paper);border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.mbox h3{margin:0;font-size:24px}
.mbox ul{margin:0;padding-left:1.2em;font-size:19px;line-height:2.1}
.setrow{display:flex;flex-direction:column;gap:8px}
.setrow .lab2{font-size:18px;font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-width:64px;min-height:52px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:700}
.seg button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.lvdesc{font-size:16px;color:var(--sub);line-height:1.7}
.chk{display:flex;align-items:center;gap:10px;font-size:18px;min-height:48px}
.chk input{width:28px;height:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="start" class="screen">
  <div class="topbar">
    <button class="btn small" id="helpBtn">つかいかた</button>
    <button class="btn small" id="setBtn" aria-label="設定"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-4px;margin-right:4px"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>設定</button>
  </div>
  <div class="startcard">
    <svg class="minimap" viewBox="0 0 300 200" aria-hidden="true">
      <rect x="0" y="0" width="300" height="200" rx="14" fill="#E4EBDD"/>
      <path d="M0,70H300M0,140H300M75,0V200M150,0V200M225,0V200" stroke="#B8C2BC" stroke-width="20"/>
      <path d="M0,70H300M0,140H300M75,0V200M150,0V200M225,0V200" stroke="#fff" stroke-width="16"/>
      <path d="M75,140V70H225V140Z" fill="none" stroke="#2F6FB3" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="112" cy="105" r="18" fill="#fff" stroke="#8C9893" stroke-width="2"/>
      <path d="M104,96H120M104,102H120M112,102V115" stroke="#1F2A2E" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="160" y="88" width="56" height="34" rx="5" fill="#fff" stroke="#8C9893" stroke-width="2"/>
      <circle cx="262" cy="34" r="20" fill="#fff" stroke="#55666C" stroke-width="2"/>
      <path d="M262,18L268,36H256Z" fill="#1F2A2E"/>
    </svg>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="chips"><span class="chip" id="chipLv"></span><span class="chip" id="chipNum"></span></div>
    <button class="btn primary" id="startBtn" style="min-width:220px;font-size:26px">はじめる</button>
  </div>
</div>

<div id="quiz" class="screen" hidden>
  <header class="qhead">
    <button class="btn small" id="quitBtn">おわる</button>
    <div id="prog"></div>
    <span class="chip" id="qLv"></span>
  </header>
  <div class="qmain">
    <div class="mapcol">
      <div id="mapbox">
        <div id="mapsizer">
          <div id="mapscale">
            <svg id="base" width="1010" height="860" viewBox="0 0 1010 860"></svg>
            <div id="labels"></div>
            <svg id="hl" width="1010" height="860" viewBox="0 0 1010 860"></svg>
          </div>
        </div>
      </div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<div id="result" class="screen" hidden>
  <div class="rescard">
    <h2>けっか</h2>
    <div class="score" id="score"></div>
    <div class="reslist" id="reslist"></div>
    <div class="actions">
      <button class="btn" id="homeBtn">はじめに もどる</button>
      <button class="btn primary" id="againBtn">もういちど</button>
    </div>
  </div>
</div>

<div class="modal" id="setModal" hidden>
  <div class="mbox" role="dialog" aria-label="設定">
    <h3>設定</h3>
    <div class="setrow">
      <span class="lab2">レベル</span>
      <div class="seg" id="segLv"></div>
      <div class="lvdesc" id="lvDesc"></div>
    </div>
    <div class="setrow">
      <span class="lab2">問題数</span>
      <div class="numrow">
        <input id="cntIn" inputmode="numeric" aria-label="問題数">
        <button class="stp" id="cntUp" aria-label="ふやす">△</button>
        <button class="stp" id="cntDn" aria-label="へらす">▽</button>
        <span class="unit" style="font-size:18px">問（3〜20）</span>
      </div>
    </div>
    <div class="setrow">
      <span class="lab2">効果音</span>
      <div class="seg" id="segSnd"><button data-v="1">ON</button><button data-v="0">OFF</button></div>
    </div>
    <div class="actions" style="justify-content:flex-end"><button class="btn primary" id="setClose">とじる</button></div>
  </div>
</div>

<div class="modal" id="helpModal" hidden>
  <div class="mbox" role="dialog" aria-label="つかいかた">
    <h3>つかいかた</h3>
    <ul id="helpList"></ul>
    <label class="chk"><input type="checkbox" id="hideHelp"><span id="hideHelpTxt"></span></label>
    <div class="actions" style="justify-content:flex-end"><button class="btn primary" id="helpClose">とじる</button></div>
  </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const R=s=>String(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

// ===== GEN-START
const MW=1010,MH=860,X0=60,Y0=90,S=150,NC=5,NR=4,HW=15,RAILY=800;
const xi=i=>X0+i*S, yj=j=>Y0+j*S;
const bc=(bx,by)=>[X0+bx*S+S/2,Y0+by*S+S/2];
const INK='#1F2A2E';
function gearG(){let d='';for(let k=0;k<8;k++){const a=k*Math.PI/4,c=Math.cos(a),s=Math.sin(a);d+=`M${(8*c).toFixed(1)},${(8*s).toFixed(1)}L${(13*c).toFixed(1)},${(13*s).toFixed(1)}`;}
  return `<path d="${d}" stroke="${INK}" stroke-width="4"/><circle r="8" fill="none" stroke="${INK}" stroke-width="3.5"/>`;}
const SYM={
  post:{n:'{郵便局|ゆうびんきょく}',g:`<path d="M-9,-10H9M-9,-3H9M0,-3V11" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`},
  school:{n:'{学校|がっこう}',g:`<text x="0" y="8.5" text-anchor="middle" font-size="24" font-weight="700" fill="${INK}" font-family="BIZ UDPGothic,sans-serif">文</text>`},
  hospital:{n:'{病院|びょういん}',g:`<path d="M0,-11V11M-11,0H11" stroke="${INK}" stroke-width="5"/>`},
  police:{n:'{交番|こうばん}',g:`<path d="M-9,-9L9,9M9,-9L-9,9" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`},
  fire:{n:'{消防署|しょうぼうしょ}',g:`<path d="M0,12V-3M-9,-12Q-9,-3 0,-3Q9,-3 9,-12M-5,4H5" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`},
  library:{n:'{図書館|としょかん}',g:`<path d="M0,-6L-12,-10V8L0,12ZM0,-6L12,-10V8L0,12Z" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>`},
  shrine:{n:'{神社|じんじゃ}',g:`<path d="M-13,-9H13M-10,-3H10M-7,-9V12M7,-9V12" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`},
  cityhall:{n:'{市役所|しやくしょ}',g:`<circle r="11" fill="none" stroke="${INK}" stroke-width="3"/><circle r="4.5" fill="none" stroke="${INK}" stroke-width="3"/>`},
  factory:{n:'{工場|こうじょう}',g:gearG()}
};
const NAMED=[{n:'スーパー'},{n:'パン{屋|や}'},{n:'{花屋|はなや}'},{n:'{本屋|ほんや}'},{n:'{薬局|やっきょく}'},{n:'レストラン'},
  {n:'ケーキ{屋|や}'},{n:'コンビニ'},{n:'{体育館|たいいくかん}'},{n:'{魚屋|さかなや}'},{n:'{公園|こうえん}',park:true}];
const STOPN=['さくら','もみじ','ひかり','みどり','あおば','つばめ','かえで','いずみ','ひばり','すずらん','わかば','こだま'];
const DN=['{北|きた}','{北東|ほくとう}','{東|ひがし}','{南東|なんとう}','{南|みなみ}','{南西|なんせい}','{西|にし}','{北西|ほくせい}'];
const DNP=['北','北東','東','南東','南','南西','西','北西'];
const DNR=['きた','ほくとう','ひがし','なんとう','みなみ','なんせい','にし','ほくせい'];
const D4=[[0,0,-1],[2,1,0],[4,0,1],[6,-1,0]]; // [dirIndex,dx,dy]

function icon(type,size){return `<svg class="ico" width="${size}" height="${size}" viewBox="-26 -26 52 52" aria-hidden="true"><circle r="24" fill="#fff" stroke="#8C9893" stroke-width="2"/>${SYM[type].g}</svg>`;}
const man=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
const corners=f=>[[f.bx,f.by],[f.bx+1,f.by],[f.bx,f.by+1],[f.bx+1,f.by+1]];
function cell(M,x,y){if(x<0||y<0||x>=NC||y>=NR)return null;return M.grid[y][x];}
const isBld=c=>c&&c.kind!=='house';
function dir8(dx,dy){if(dx===0&&dy===0)return -1;if(!(dx===0||dy===0||Math.abs(dx)===Math.abs(dy)))return -1;
  let a=Math.atan2(dx,-dy);return ((Math.round(a/(Math.PI/4))%8)+8)%8;}
function fnm(f,lv){return f.kind==='sym'&&lv<=2?`${f.mk}${icon(f.type,30)}`:f.mk;}
const stopNm=s=>`${s.mk}バス{停|てい}`;
function loopPts(M,s,f){const n=M.nodes.length,p=[];for(let t=0;t<=f;t++)p.push(M.nodes[(s+t)%n]);return p;}
function loopSum(M,s,f){const n=M.nodes.length;let t=0,l=[];for(let k=0;k<f;k++){t+=M.mins[(s+k)%n];l.push(M.mins[(s+k)%n]);}return {t,l};}
function lpath(p,q){return [[p[0],p[1]],[q[0],p[1]],[q[0],q[1]]];}

function genMap(lv){
  const a=1,b=pick([3,4]),c=pick([1,2]);
  const cw=[];
  for(let i=a;i<=b;i++)cw.push([i,c]);
  for(let j=c+1;j<=4;j++)cw.push([b,j]);
  for(let i=b-1;i>=a;i--)cw.push([i,4]);
  for(let j=3;j>c;j--)cw.push([a,j]);
  const isCw=Math.random()<.5;
  const nodes=isCw?cw:[cw[0],...cw.slice(1).reverse()];
  let iw=pick([a,a+1]),ie=pick([b,b-1]);if(ie-iw<2){iw=a;ie=b;}
  const names=shuffle(STOPN);let k=0;
  const stops=nodes.map((p,idx)=>{const s={i:p[0],j:p[1],idx};
    if(p[1]===4&&p[0]===iw){s.sta='W';s.mk='{西駅前|にしえきまえ}';}
    else if(p[1]===4&&p[0]===ie){s.sta='E';s.mk='{東駅前|ひがしえきまえ}';}
    else s.mk=names[k++];return s;});
  const mins=nodes.map(()=>ri(1,3));
  const cells=[];for(let y=0;y<NR;y++)for(let x=0;x<NC;x++)cells.push([x,y]);
  const sc=shuffle(cells);
  const sk=shuffle(Object.keys(SYM));
  const countType=sk[0],nCount=lv>=2?ri(2,4):ri(2,3);
  const grid=[...Array(NR)].map(()=>Array(NC).fill(null));
  const facs=[];let ci=0;

function drawHL(ops,M){
  const C='#E8761E';let s=`<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0L10,5L0,10Z" fill="${C}"/></marker></defs><style>.halo{paint-order:stroke;stroke:#fff;stroke-width:5px;fill:${C};font-family:"BIZ UDPGothic",sans-serif}</style>`;
  const pt=([i,j])=>[xi(i),yj(j)];
  for(const o of ops){
    if(o.t==='circ')s+=`<circle cx="${o.p[0]}" cy="${o.p[1]}" r="${o.r}" fill="rgba(232,118,30,.12)" stroke="${C}" stroke-width="5" ${o.dash?'stroke-dasharray="10 8"':''}/>`;
    else if(o.t==='num')s+=`<circle cx="${o.p[0]+(o.small?0:30)}" cy="${o.p[1]-(o.small?0:30)}" r="${o.small?15:17}" fill="${C}"/><text x="${o.p[0]+(o.small?0:30)}" y="${o.p[1]-(o.small?0:30)+7}" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">${o.n}</text>`+(o.small?'':`<circle cx="${o.p[0]}" cy="${o.p[1]}" r="38" fill="none" stroke="${C}" stroke-width="5"/>`);
    else if(o.t==='path'){const P=o.pts.map(pt);s+=`<polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${C}" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity=".6" ${o.arrow?'marker-end="url(#ah)"':''}/>`;
      if(o.ticks)for(let k=0;k<P.length-1;k++){const [a,b]=[P[k],P[k+1]];const L=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);const n=L/S;for(let t=0;t<n;t++){const r=(t+.5)/n;const x=a[0]+(b[0]-a[0])*r,y=a[1]+(b[1]-a[1])*r;s+=`<text x="${x}" y="${y-14}" font-size="16" font-weight="700" text-anchor="middle" class="halo">100m</text>`;}}}
    else if(o.t==='arrow'){const [a,b]=[o.from,o.to];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const ux=(b[0]-a[0])/L,uy=(b[1]-a[1])/L;const st=o.thick?14:30,en=o.thick?14:34;
      s+=`<line x1="${a[0]+ux*st}" y1="${a[1]+uy*st}" x2="${b[0]-ux*en}" y2="${b[1]-uy*en}" stroke="${C}" stroke-width="${o.thick?10:7}" stroke-linecap="round" marker-end="url(#ah)"/>`;}
    else if(o.t==='rose'){const [cx,cy]=o.p;for(let d=0;d<8;d++){const a=d*Math.PI/4;const ex=Math.sin(a),ey=-Math.cos(a);
        s+=`<line x1="${cx}" y1="${cy}" x2="${cx+ex*120}" y2="${cy+ey*120}" stroke="${C}" stroke-width="${d===o.d?5:2.5}" stroke-dasharray="${d===o.d?'':'6 6'}" opacity="${d===o.d?1:.8}"/>`;
        let lx=cx+ex*150,ly=cy+ey*150+8;lx=Math.max(30,Math.min(820,lx));ly=Math.max(40,Math.min(MH-12,ly));
        s+=svgRuby(lx,ly,DNP[d],DNR[d],d===o.d?24:19);}}
    else if(o.t==='tag'){s+=`<text x="${o.p[0]}" y="${o.p[1]+62}" font-size="22" font-weight="700" text-anchor="middle" class="halo">${o.s}</text>`;}
    else if(o.t==='legend'){const y=LEGY[o.type];s+=`<rect x="848" y="${y-19}" width="154" height="38" rx="8" fill="rgba(232,118,30,.12)" stroke="${C}" stroke-width="4"/>`;}
    else if(o.t==='compass'){s+=`<circle cx="935" cy="76" r="44" fill="none" stroke="${C}" stroke-width="4"/>`;}
    else if(o.t==='scale'){s+=`<rect x="836" y="772" width="172" height="76" rx="8" fill="rgba(232,118,30,.10)" stroke="${C}" stroke-width="4"/>`;}
    else if(o.t==='rail'){s+=`<line x1="${xi(o.from)}" y1="${RAILY}" x2="${xi(o.to)}" y2="${RAILY}" stroke="${C}" stroke-width="9" stroke-dasharray="14 10" opacity=".9" marker-end="url(#ah)"/>`;
      s+=`<rect x="${xi(o.to)-56}" y="${RAILY-28}" width="112" height="56" rx="8" fill="none" stroke="${C}" stroke-width="4"/>`;}
  }
  $('hl').innerHTML=s;
}
function thumb(p,st){
  let s=`<svg viewBox="${X0-40} ${Y0-40} ${5*S+80} ${4*S+120}" aria-hidden="true"><rect x="${X0-40}" y="${Y0-40}" width="${5*S+80}" height="${4*S+120}" fill="#FBFCF9"/>`;
  let road='';for(let j=0;j<=4;j++)road+=`M${X0-24},${yj(j)}H${xi(5)+24}`;for(let i=0;i<=5;i++)road+=`M${xi(i)},${Y0-24}V${yj(4)+12}`;

function beep(ok){if(!ST.snd||!actx)return;try{const t=actx.currentTime;(ok?[[660,0],[880,.13]]:[[392,0],[330,.14]]).forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;

let Q=[],qi=0,cur=null,curM=null,answered=false,results=[];
function show(id){['start','quiz','result'].forEach(x=>$(x).hidden=x!==id);if(id==='quiz')requestAnimationFrame(fitMap);}
function buildQuestions(){
  Q=[];while(Q.length<ST.cnt){const set=makeSet(ST.lv);if(!set)break;set.qs.forEach(q=>{if(Q.length<ST.cnt){q.M=set.M;Q.push(q);}});}

function startQuiz(){buildQuestions();qi=0;results=[];curM=null;$('qLv').textContent='レベル '+ST.lv;show('quiz');showQ();}
function prog(){$('prog').innerHTML=Q.map((q,i)=>`<span class="dot ${i<results.length?(results[i]?'ok':'ng'):''} ${i===qi?'now':''}"></span>`).join('')+`<span style="font-size:17px;font-weight:700;margin-left:6px">${qi+1} / ${Q.length}</span>`;}
function showQ(){

  else h+=`<div class="numrow"><input id="numIn" inputmode="numeric" value="0" aria-label="こたえ"><span class="unit">${R(cur.unit)}</span><button class="stp" id="nUp" aria-label="ふやす">△</button><button class="stp" id="nDn" aria-label="へらす">▽</button></div><button class="btn primary" id="numOk" style="align-self:flex-start">こたえる</button>`;
  h+=`<div class="fb" id="fb" hidden></div><div id="fig"></div><div class="exp" id="exp" hidden></div><button class="btn primary next" id="nextBtn" hidden></button>`;
  p.innerHTML=h;p.scrollTop=0;

  if(cur.type==='num'){
    const inp=$('numIn');const get=()=>parseInt(String(inp.value).replace(/[^0-9]/g,''),10)||0;
    $('nUp').addEventListener('click',()=>{inp.value=Math.min(cur.max,get()+cur.step);});

    $('numOk').addEventListener('click',()=>{unlockAudio();if(answered)return;finish(get()===cur.num,`${cur.num}${cur.unit}`);
      $('numOk').disabled=true;$('nUp').disabled=true;$('nDn').disabled=true;inp.disabled=true;});

function choose(i){
  if(answered)return;
  const ok=i===cur.ans;
  $('panel').querySelectorAll('.choice').forEach(b=>{const k=+b.dataset.i;b.disabled=true;
    if(k===cur.ans){b.classList.add('ok');b.querySelector('.mk').textContent='○ せいかい';}
    else if(k===i){b.classList.add('ng');b.querySelector('.mk').textContent='✕';}});
  const lab=cur.type==='thumb'?`${cur.ans+1}`:cur.opts[cur.ans];
  finish(ok,cur.type==='thumb'?`${cur.ans+1}ばんの {図|ず}`:lab);
}
function finish(ok,ansText){
  answered=true;results.push(ok);beep(ok);

}

// ---- 地図の大きさ合わせ
function fitMap(){
  const box=$('mapbox');if(!box||$('quiz').hidden)return;
  const w=box.clientWidth-12,h=box.clientHeight-12;if(w<=0||h<=0)return;
  const s=Math.min(w/MW,h/MH);
  $('mapsizer').style.width=(MW*s)+'px';$('mapsizer').style.height=(MH*s)+'px';
  $('mapscale').style.transform=`scale(${s})`;
}

// ---- 画面の文字と操作
$('title').innerHTML=R('{地図|ちず}を {読|よ}もう');
$('lead').innerHTML=R('{地図|ちず}を {見|み}て、もんだいに こたえるよ。<br>はじめるを おすと スタートするよ。');
$('helpList').innerHTML=['{地図|ちず}を {見|み}て、もんだいに こたえてね。','{地図|ちず}の {上|うえ}が {北|きた}だよ。{右上|みぎうえ}の {方位|ほうい}{記号|きごう}で たしかめてね。','{記号|きごう}が わからない ときは、{地図|ちず}の {右|みぎ}がわの {説明|せつめい}を {見|み}てね。','こたえると、{見|み}る ところに だいだい{色|いろ}の しるしが つくよ。'].map(t=>`<li>${R(t)}</li>`).join('');
$('hideHelpTxt').innerHTML=R('{次|つぎ}からは {出|だ}さない');
$('setBtn').addEventListener('click',()=>{refreshSet();$('setModal').hidden=false;});
$('setClose').addEventListener('click',()=>{$('setModal').hidden=true;});
$('helpBtn').addEventListener('click',()=>{$('helpModal').hidden=false;});
$('helpClose').addEventListener('click',()=>{try{if($('hideHelp').checked)localStorage.setItem('chizu02_hidehelp','1');else localStorage.removeItem('chizu02_hidehelp');}catch(e){}$('helpModal').hidden=true;});
$('startBtn').addEventListener('click',()=>{unlockAudio();startQuiz();});
$('quitBtn').addEventListener('click',()=>{refreshSet();show('start');});
$('homeBtn').addEventListener('click',()=>{refreshSet();show('start');});
$('againBtn').addEventListener('click',()=>{unlockAudio();startQuiz();});
window.addEventListener('resize',fitMap);
window.addEventListener('orientationchange',()=>setTimeout(fitMap,250));
if(window.ResizeObserver)new ResizeObserver(fitMap).observe($('mapbox'));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitMap);
refreshSet();
try{if(localStorage.getItem('chizu02_hidehelp')!=='1')$('helpModal').hidden=false;else $('hideHelp').checked=true;}catch(e){$('helpModal').hidden=false;}
</script>
